<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Nginx Application</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            text-align: center;
            margin-top: 100px;
        }

        .container {
            background: white;
            width: 600px;
            margin: auto;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
        }

        h1 {
            color: #0078d7;
        }

        p {
            font-size: 18px;
        }

        button {
            background-color: #0078d7;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #005ea6;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Welcome to Nginx on Docker</h1>
        <p>This application is running inside an Nginx container.</p>

        <p id="message">Click the button below</p>

        <button onclick="changeMessage()">
            Click Me
        </button>
    </div>

    <script>
        function changeMessage() {
            document.getElementById("message").innerHTML =
                "✅ Nginx Container is Working Successfully!!!!!";
        }
    </script>

</body>
</html>
